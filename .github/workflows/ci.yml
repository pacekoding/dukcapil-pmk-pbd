name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dukcapil-pbd-fe/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/dukcapil-pbd-fe
        run: npm ci

      - name: Run frontend lint
        working-directory: apps/dukcapil-pbd-fe
        run: npm run lint

      - name: Build frontend
        working-directory: apps/dukcapil-pbd-fe
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Download Go modules
        working-directory: apps/dukcapil-pbd-be
        run: go mod download

      - name: Run Go vet
        working-directory: apps/dukcapil-pbd-be
        run: go vet ./...

      - name: Run Go tests
        working-directory: apps/dukcapil-pbd-be
        run: go test ./...

      - name: Build backend
        working-directory: apps/dukcapil-pbd-be
        run: go build ./cmd/api
